name = "display_block"
kind = "pair"
description = "Mode 1 frame build's display block: backdrop, brightness, main layers, sprite size pair, raster binding and forced blank, reporting whether colour math and the raster drive are due. 12 calls over three scenes."
unit_labels = ["loom_pvs_mode1_display"]
helper_labels = []

[provenance]
loom_commit = "72f1cd4"
c_source = "runtime/src/mode1.c:1377-1402 at 72f1cd4^ (loom_mode1_build_frame's display block after the scroll)"
asm_source = "runtime/backends/pvsneslib/src/oam.asm:loom_pvs_mode1_display at 72f1cd4 (unchanged at HEAD)"
notes = "The C is cut to the asm's interface: the mode1 state it read (ready, raster_enabled, brightness) and has_bg2/has_bg3 arrive packed in `bits` and are unpacked first; the two calls that stay C (loom_mode1_apply_color_math, a no-op for colour-math mode NORMAL, and loom_mode1_drive_raster) become the result bits 2 and 4 the asm reports. The asm reads LoomMode1Scene by offset (68 bytes under 816-tcc, asserted in loom_types.h)."
