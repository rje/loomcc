name = "body_scan_floor"
kind = "pair"
description = "Platformer body floor scan: the first floor (solid, one-way from above, or a slope under the sensor) between the feet and the reach. 14 scans over a 24x14 room."
unit_labels = ["loom_pvs_body_scan_floor"]
helper_labels = []

[provenance]
loom_commit = "c027cfd"
c_source = "runtime/src/movement.c:786-813 at c027cfd^ (the floor-scan loop in loom_movement_platformer_tick; actor.c:660-686 is the same loop for actor bodies) plus loom_movement_floor_in_cell (movement.c:407-421) and LOOM_MOVEMENT_CELL_AT (include/loom/movement.h:205-218)"
asm_source = "runtime/backends/pvsneslib/src/body.asm:loom_pvs_body_scan_floor (+ loom_pvs_body_cell, loom_pvs_body_grid, LOOM_SIGNED_CMP) at c027cfd (unchanged at HEAD)"
notes = "Verbatim C, including `floor >= feet - LOOM_MOVEMENT_TILE_PIXELS`: LOOM_MOVEMENT_TILE_PIXELS is a loom_u16, so under 816-tcc's 16-bit int that compare is unsigned, while the asm (and the 32-bit host) compare signed. They agree while feet >= 16 and the slope floor >= 0, which every input here keeps (and which a body inside the room always has). The C calls loom_movement_floor_in_cell (counted as unit); the asm computes the slope floor inline."
